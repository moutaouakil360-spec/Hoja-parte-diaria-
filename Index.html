<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TECNOVA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C1F22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite:#1C1F22;
    --graphite-soft:#2B2F33;
    --concrete:#F3F1EC;
    --concrete-line:#D8D3C8;
    --amber:#E5972E;
    --amber-deep:#B8721E;
    --ink:#1C1F22;
    --ink-soft:#5B5F63;
    --white:#FFFFFF;
    --wa:#25D366;
    --font-display:'Oswald', sans-serif;
    --font-body:'Work Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--concrete);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--concrete);}

  .stripe{
    height:10px;
    background:repeating-linear-gradient(135deg, var(--amber) 0 14px, var(--graphite) 14px 28px);
  }

  header.top{
    background:var(--graphite);
    color:var(--concrete);
    padding:22px 20px 20px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:0.5px;
    color:var(--white);
  }
  .brand .mark span{color:var(--amber);}
  .brand .sub{
    font-size:13px;
    color:#A9AEB3;
  }
  h1.page-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:19px;
    margin:14px 0 0;
    color:var(--concrete);
  }

  .logo-img{
    display:block;
    width:180px;
    max-width:60%;
    height:auto;
    border-radius:3px;
  }
  .page-title small{
    display:block;
    font-family:var(--font-body);
    font-weight:400;
    font-size:13px;
    color:#A9AEB3;
    margin-top:3px;
  }

  main{padding:22px 20px 60px;}

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    border:1.5px solid var(--concrete-line);
    background:var(--white);
    border-radius:3px;
    padding:11px 12px;
    font-family:var(--font-body);
    font-size:15px;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--amber);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .submit-btn{
    width:100%;
    background:var(--wa);
    color:var(--white);
    border:none;
    border-radius:3px;
    padding:14px;
    font-family:var(--font-display);
    font-weight:600;
    font-size:15px;
    letter-spacing:0.3px;
    cursor:pointer;
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .submit-btn:active{opacity:0.85;}

  .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    text-align:center;
  }

  .error{
    display:none;
    background:#F6E7E7;
    border:1.5px solid #B23A3A;
    color:#7A2626;
    border-radius:3px;
    padding:12px 14px;
    font-size:13.5px;
    margin-top:14px;
  }
  .error.show{display:block;}
</style>
</head>
<body>
<div class="app">

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
document.getElementById('fecha').value = todayStr();

function formatFecha(f){
  const [y,m,d] = f.split('-');
  return `${d}/${m}/${y}`;
}

function buildPdf(data){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const pageW = 210;
  const marginX = 15;
  let y = 18;

  // Header: logo image + company block
  const logoW = 42;
  const logoH = logoW / (750/314);
  try{
    doc.addImage(LOGO_DATA_URI, 'JPEG', marginX, y - 6, logoW, logoH);
  }catch(e){
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.setTextColor(28, 31, 34);
    doc.text('TECNOVA', marginX, y);
  }
  y += logoH - 6;

  doc.setFontSize(8.5);
  doc.setTextColor(110, 110, 110);
  const infoLines = [
    `CIF: ${EMPRESA.cif}`,
    EMPRESA.direccion,
    `Tel: ${EMPRESA.telefono}  ·  ${EMPRESA.email}  ·  ${EMPRESA.web}`
  ];
  let iy = y + 6;
  infoLines.forEach(line => {
    const wrapped = doc.splitTextToSize(line, 120);
    doc.text(wrapped, marginX, iy);
    iy += wrapped.length * 3.6;
  });

  // Fecha box (top right)
  doc.setDrawColor(216, 211, 200);
  doc.setLineWidth(0.4);
  doc.rect(pageW - marginX - 45, y - 6, 45, 14);
  doc.setFontSize(8);
  doc.setTextColor(90, 90, 90);
  doc.text('FECHA', pageW - marginX - 41, y - 1);
  doc.setFontSize(12);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(28, 31, 34);
  doc.text(formatFecha(data.fecha), pageW - marginX - 41, y + 5.5);

  y = iy + 6;

  // Title bar
  doc.setFillColor(28, 31, 34);
  doc.rect(marginX, y, pageW - marginX * 2, 9, 'F');
  doc.setFontSize(11.5);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(255, 255, 255);
  doc.text('HOJA DE TRABAJO', marginX + 4, y + 6.2);
  y += 9;
  // amber accent strip
  doc.setFillColor(229, 151, 46);
  doc.rect(marginX, y, pageW - marginX * 2, 1.6, 'F');
  y += 10;

  function fieldRow(label, value, opts){
    opts = opts || {};
    doc.setFontSize(8.5);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(90, 90, 90);
    doc.text(label.toUpperCase(), marginX, y);
    y += 5;
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(28, 31, 34);
    const wrapped = doc.splitTextToSize(value || '-', pageW - marginX * 2 - 4);
    doc.text(wrapped, marginX, y);
    y += wrapped.length * 5.5;
    doc.setDrawColor(216, 211, 200);
    doc.setLineWidth(0.3);
    doc.line(marginX, y + 2, pageW - marginX, y + 2);
    y += 9;
  }

  fieldRow('Operario', data.nombre);
  fieldRow('Obra / cliente', data.obra);
  fieldRow('Horas trabajadas', `${data.horas} h`);
  fieldRow('Trabajo realizado', data.trabajo);
  if(data.materiales) fieldRow('Materiales utilizados', data.materiales);

  y += 4;
  doc.setFontSize(7.5);
  doc.setTextColor(140, 140, 140);
  doc.text('Documento generado automáticamente desde la hoja de trabajo digital de TECNOVA.', marginX, 285);

  return doc;
}

document.getElementById('work-form').addEventListener('submit', async function(e){
  e.preventDefault();

  const btn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('error');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Generando PDF…';

  const data = {
    nombre: document.getElementById('nombre').value.trim(),
    fecha: document.getElementById('fecha').value,
    horas: document.getElementById('horas').value,
    obra: document.getElementById('obra').value.trim(),
    trabajo: document.getElementById('trabajo').value.trim(),
    materiales: document.getElementById('materiales').value.trim()
  };

  try{
    const doc = buildPdf(data);
    const fileName = `Parte_${data.nombre.replace(/\s+/g,'_')}_${data.fecha}.pdf`;
    const pdfBlob = doc.output('blob');
    const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

    const canShareFile = navigator.canShare && navigator.canShare({ files: [pdfFile] });

    if(canShareFile){
      await navigator.share({
        files: [pdfFile],
        title: 'Parte de trabajo TECNOVA',
        text: `Parte de trabajo de ${data.nombre} - ${formatFecha(data.fecha)}`
      });
    }else{
      // Fallback: download the PDF, then open WhatsApp so the user attaches it manually
      const blobUrl = URL.createObjectURL(pdfBlob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);

      const waMsg = `Parte de trabajo de ${data.nombre} (${formatFecha(data.fecha)}). Adjunto el PDF descargado.`;
      const waUrl = `https://wa.me/${ENCARGADO_TEL}?text=${encodeURIComponent(waMsg)}`;
      window.open(waUrl, '_blank');
      document.getElementById('hint').textContent = 'PDF descargado. En WhatsApp, adjunta el archivo desde tus descargas.';
    }
  }catch(err){
    if(err && err.name === 'AbortError'){
      // user cancelled the share sheet — not an error
    }else{
      errorBox.classList.add('show');
    }
  }finally{
    btn.disabled = false;
    btn.textContent = 'Generar PDF y enviar por WhatsApp';
  }
});
</script>
</body>
</html>
